<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | HUMANBULB Impact Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <main class="main-content" style="min-height:100vh;place-content:center;padding:32px;">
    <section class="card auth-card">
      <p class="eyebrow">HUMANBULB</p>
      <h2>Sign in to the Impact Portal</h2>
      <p class="hero-text">Access HUMANBULB’s program uploads, analytics, and grant-ready reports. Portal access is limited to approved staff accounts.</p>
      <form class="auth-form" id="login-form">
        <label>
          <span>Email</span>
          <input id="login-email" type="email" required>
        </label>
        <label>
          <span>Password</span>
          <input id="login-password" type="password" required minlength="8">
        </label>
        <div class="hero-actions">
          <button class="button primary button-reset" type="submit">Sign In</button>
          <button class="button secondary button-reset" type="button" id="toggle-signup-button">Create Account</button>
        </div>
      </form>
      <form class="auth-form" id="signup-form" hidden>
        <label>
          <span>Full Name</span>
          <input id="signup-name" type="text">
        </label>
        <label>
          <span>Email</span>
          <input id="signup-email" type="email" required>
        </label>
        <label>
          <span>Password</span>
          <input id="signup-password" type="password" required minlength="8">
        </label>
        <div class="hero-actions">
          <button class="button primary button-reset" type="submit">Create Account</button>
          <button class="button secondary button-reset" type="button" id="toggle-login-button">Back to Sign In</button>
        </div>
        <p class="helper-text">Use an approved HUMANBULB staff email to create an account.</p>
      </form>
      <p class="auth-message" id="auth-message"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
